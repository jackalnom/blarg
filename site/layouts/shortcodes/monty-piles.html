{{- $id := .Get "id" | default "monty-piles" -}}
<figure id="{{ $id }}" class="probability-vis">
    <div class="sim-controls">
        <button type="button" data-step>Play one game</button>
        <button type="button" data-run>Run</button>
        <button type="button" data-reset class="sim-reset-btn">Reset</button>
    </div>
    <canvas role="img"></canvas>
    <span data-summary hidden></span>
    <noscript>With a knowing host, staying wins 1/3 and switching wins 2/3 of games. With a random host, 1/3 of games reveal the car and are discarded. Among the remaining games, staying and switching each win 1/2.</noscript>
</figure>
<script type="module">
    import { initMontyPiles } from "/js/teaching-visuals.js";
    initMontyPiles({ id: "{{ $id }}" });
</script>
